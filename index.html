<!doctype html>
<html lang="en" data-motion="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFCFF" />
    <!--head-tags-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/images/brand/sinc-logo-256.webp" />
    <script>
      /* Runs before first paint: applies the saved motion preference and, for a first visit,
         covers the page until the opening story mounts. Storage errors never block access. */
      (function () {
        var d = document.documentElement, motion = "on", introPending = false;
        try {
          var choice = localStorage.getItem("sinc-motion");
          var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (choice === "off" || (choice !== "on" && reduced)) motion = "off";
          // the opening story only plays on the home page, and not when arriving at a section (/#team)
          var home = location.pathname === "/" || location.pathname === "/index.html";
          // search engine crawlers get the page itself (same content, no 15-second animation over it)
          var crawler = /bot|crawl|spider|slurp|bingpreview|facebookexternalhit|embedly|whatsapp|telegram/i.test(navigator.userAgent);
          introPending = home && !crawler && !location.hash && motion === "on" && !localStorage.getItem("sinc-intro-seen-v2");
        } catch (e) { introPending = false; }
        d.setAttribute("data-motion", motion);
        if (introPending) d.classList.add("intro-pending");
      })();
    </script>
    <noscript><style>html.intro-pending #root { visibility: visible !important; } .intro-cover { display: none !important; }</style></noscript>
  </head>
  <body>
    <div class="intro-cover" aria-hidden="true"></div>
    <div id="root" data-path="<!--app-path-->"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
