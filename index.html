<!doctype html>
<html lang="en" data-motion="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFCFF" />
    <title>SINC — Where Ambition Finds Its People</title>
    <meta name="description" content="SINC — the Society for Innovation, Network & Collaboration — is a growing community that connects people with different strengths so they can find collaborators, learn together and build what comes next." />
    <meta property="og:title" content="SINC — Where Ambition Finds Its People" />
    <meta property="og:description" content="Connect with people who share your drive. Find collaborators, learn together, and turn ideas into something real." />
    <meta property="og:image" content="/images/brand/sinc-og.jpg" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* Runs before first paint: applies the saved motion preference and, for a first visit,
         covers the page until the opening story mounts. Storage errors never block access. */
      (function () {
        var d = document.documentElement, motion = "on", introPending = false;
        try {
          var choice = localStorage.getItem("sinc-motion");
          var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (choice === "off" || (choice !== "on" && reduced)) motion = "off";
          introPending = motion === "on" && !localStorage.getItem("sinc-intro-seen-v2");
        } catch (e) { introPending = false; }
        d.setAttribute("data-motion", motion);
        if (introPending) d.classList.add("intro-pending");
      })();
    </script>
    <noscript><style>html.intro-pending #root { visibility: visible !important; } .intro-cover { display: none !important; }</style></noscript>
  </head>
  <body>
    <div class="intro-cover" aria-hidden="true"></div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
